function exOf(a){ return S.exercises.find(function(x){ return x.id===a.exercise_id; })||{title:"Exercise",checklist:[]}; }

function done(aid,uid){ return S.completions.some(function(c){ return c.assignment_id===aid && c.user_id===uid; }); }
function weekOf(){ if (!S.cohort.start_date) return 0; var n=Math.floor((Date.now()-new Date(S.cohort.start_date+"T00:00:00"))/864e5); return n<0?0:Math.min(4,Math.floor(n/7)+1); }
function dayOf(){ if (!S.cohort.start_date) return null; var n=Math.floor((Date.now()-new Date(S.cohort.start_date+"T00:00:00"))/864e5)+1; return n<1?null:Math.min(30,n); }

  var html='<div class="stats"><div><b>'+L.length+'</b><span>Learners (max 5)</span></div><div><b>'+(all?Math.round(tot/all*100):0)+'%</b><span>Exercises completed</span></div><div><b>'+S.observations.length+'</b><span>Observations logged</span></div><div><b>'+(cur||"&ndash;")+'</b><span>Current week</span></div></div>';
  html+='<section class="card"><h2>Exercise completion by learner</h2><div class="wrap"><table><thead><tr><th>Learner</th>'+[1,2,3,4].map(function(w){ return '<th>Week '+w+'</th>'; }).join("")+'<th>Observed</th></tr></thead><tbody>'+
    (L.length?L.map(function(l){ return '<tr><td><b>'+e(S.names[l.user_id]||"Learner")+'</b></td>'+[1,2,3,4].map(function(w){ var as=S.assignments.filter(function(a){ return a.week===w; }); var n=as.filter(function(a){ return done(a.id,l.user_id); }).length; return '<td>'+(as.length?n+' / '+as.length:'&ndash;')+'</td>'; }).join("")+'<td>'+S.observations.filter(function(o){ return o.learner_id===l.user_id; }).length+'</td></tr>'; }).join(""):'<tr><td colspan="6">No learners added yet.</td></tr>')+'</tbody></table></div>'+
    '<p class="muted">Completion is about practice, not results. Store figures never decide whether anyone earns a credential.</p></section>';
  return html;
}
function renderObserve(){
  var L=learners(), cur=weekOf()||1;
  var as=S.assignments.filter(function(a){ return a.week===cur; }); if (!as.length) as=S.assignments;
  var html='<section class="card"><h2>Log an observation</h2><p class="muted">Watch a learner practise, then tick what you saw. Keep notes about the skill, never about a customer&rsquo;s health.</p>'+
   '<div class="form2"><label>Learner<select id="obL">'+L.map(function(l){ return '<option value="'+l.user_id+'">'+e(S.names[l.user_id]||"Learner")+'</option>'; }).join("")+'</select></label>'+
   '<label>Exercise<select id="obA">'+as.map(function(a){ return '<option value="'+a.id+'">Week '+a.week+': '+e(exOf(a).title)+'</option>'; }).join("")+'</select></label></div>'+
   '<div id="obChk" class="chks"></div><label class="full">Notes (optional)<textarea id="obN" maxlength="1500" placeholder="What went well, and one thing to coach next."></textarea></label>'+
   '<button class="btn dark" id="obSave"'+(L.length&&as.length?'':' disabled')+'>Save observation</button></section>';
  html+='<section class="card"><h2>Recent observations</h2>'+(S.observations.length?S.observations.map(function(o){ var a=S.assignments.find(function(x){ return x.id===o.assignment_id; }); return '<div class="obs"><small>'+e(S.names[o.learner_id]||"Learner")+' &middot; Week '+(o.week||"")+(a?' &middot; '+e(exOf(a).title):'')+'</small><p>'+(o.checklist||[]).map(function(c){ return '<span class="tick">&#10003; '+e(c)+'</span>'; }).join(" ")+'</p>'+(o.notes?'<p>'+e(o.notes)+'</p>':'')+'</div>'; }).join(""):'<p class="muted">No observations yet.</p>')+'</section>';
  return html;
}
function obChecklist(){ var sel=document.getElementById("obA"); if (!sel) return; var a=S.assignments.find(function(x){ return String(x.id)===sel.value; }); var c=a?exOf(a).checklist||[]:[]; document.getElementById("obChk").innerHTML=c.map(function(t,i){ return '<label class="chk"><input type="checkbox" value="'+e(t)+'"> '+e(t)+'</label>'; }).join(""); }
var ROWS=[["baseline",0,"Baseline"],["weekly",1,"Week 1"],["weekly",2,"Week 2"],["weekly",3,"Week 3"],["weekly",4,"Week 4"],["closing",5,"Closing"]];
function sc(kind,week){ return S.scorecards.find(function(x){ return x.kind===kind && x.week===week; })||{}; }
function renderScore(){
  var cur=S.cohort.currency||"USD";
  var html='<section class="card"><h2>Store scorecard</h2><p class="muted">Enter figures for this store only, in '+e(cur)+'. Count only insole transactions linked to a scan. Use the same definitions every week.</p>'+
  '<div class="wrap"><table class="sc"><thead><tr><th>Period</th><th>Scans</th><th>Insole transactions linked to scans</th><th>Scan-to-insole conversion</th><th>Insole gross profit ('+e(cur)+')</th><th>Returns</th><th>Coaching completion</th><th>Context: stockouts, promotions, staffing, notes</th><th></th></tr></thead><tbody>'+
  ROWS.map(function(r){ var x=sc(r[0],r[1]), cc=r[0]==="weekly"?weekCompletion(r[1]):null; return '<tr data-row="'+r[0]+'|'+r[1]+'"><th>'+r[2]+'</th><td><input type="number" min="0" step="1" data-f="scans" value="'+(x.scans==null?"":x.scans)+'"></td><td><input type="number" min="0" step="1" data-f="insole_tx" value="'+(x.insole_tx==null?"":x.insole_tx)+'"></td><td class="cv">'+conv(x)+'</td><td><input type="number" min="0" step="0.01" data-f="insole_gp" value="'+(x.insole_gp==null?"":x.insole_gp)+'"></td><td><input type="number" min="0" step="1" data-f="returns" value="'+(x.returns==null?"":x.returns)+'"></td><td>'+(cc==null?'&ndash;':cc+'%')+'</td><td class="ctx"><input data-f="stockouts" placeholder="Stockouts" value="'+e(x.stockouts||"")+'"><input data-f="promotions" placeholder="Promotions" value="'+e(x.promotions||"")+'"><input data-f="staffing" placeholder="Staffing changes" value="'+e(x.staffing||"")+'"><input data-f="notes" placeholder="Notes" value="'+e(x.notes||"")+'"></td><td><button class="btn dark sm" data-save="'+r[0]+'|'+r[1]+'">Save</button></td></tr>'; }).join("")+'</tbody></table></div>'+
  '<p class="muted"><b>Scan-to-insole conversion</b> = insole transactions linked to scans &divide; scans &times; 100. Shown as n/a when there were no scans. Coaching completion is calculated from completed exercises.</p>'+
  '<p class="muted">Before-and-after changes show what happened during the pilot, not what caused it. Stock, promotions, staffing and seasonality all affect results.</p></section>';
  return html;
}
function render(){
  if (!S.cohort) return;
  var body=TAB==="overview"?renderOverview():TAB==="observe"?renderObserve():TAB==="score"?renderScore():renderLearn();
  app.innerHTML=head()+body;
  if (TAB==="observe") { obChecklist(); var sel=document.getElementById("obA"); if (sel) sel.addEventListener("change",obChecklist); }
}
/* ---------- actions ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target, b;
  if ((b=t.closest("[data-tab]"))) { TAB=b.dataset.tab; render(); return; }
  if ((b=t.closest("[data-done]"))) { var aid=+b.dataset.done, refl=(document.querySelector('[data-refl="'+aid+'"]')||{}).value||"";
    if (DEMO) { S.completions.push({assignment_id:aid,user_id:S.me}); render(); toast("Marked complete (demonstration only, not saved)"); return; }
    b.disabled=true; SB.from("perform_completions").insert({assignment_id:aid,reflection:refl.slice(0,1000)}).then(function(r){ if (r.error) { b.disabled=false; toast("Could not save. Please try again."); return; } S.completions.push({assignment_id:aid,user_id:S.me}); render(); toast("Saved"); }); return; }
  if ((b=t.closest("[data-undo]"))) { var u=+b.dataset.undo;
    if (DEMO) { S.completions=S.completions.filter(function(c){ return !(c.assignment_id===u&&c.user_id===S.me); }); render(); return; }
    SB.from("perform_completions").delete().eq("assignment_id",u).eq("user_id",S.me).then(function(r){ if (r.error) { toast("Could not update."); return; } S.completions=S.completions.filter(function(c){ return !(c.assignment_id===u&&c.user_id===S.me); }); render(); }); return; }
  if (t.id==="obSave") { var lid=document.getElementById("obL").value, aid2=+document.getElementById("obA").value, a=S.assignments.find(function(x){ return x.id===aid2; });
    var chk=[].map.call(document.querySelectorAll("#obChk input:checked"),function(i){ return i.value; }), notes=document.getElementById("obN").value.trim().slice(0,1500);
    if (!chk.length && !notes) { toast("Tick at least one item or add a note."); return; }
    var row={cohort_id:S.cohort.id,assignment_id:aid2,learner_id:lid,week:a?a.week:null,checklist:chk,notes:notes};
    if (DEMO) { S.observations.unshift(Object.assign({id:Date.now(),created_at:new Date().toISOString()},row)); render(); toast("Saved (demonstration only)"); return; }
    t.disabled=true; SB.from("perform_observations").insert(row).select().then(function(r){ t.disabled=false; if (r.error) { toast("Could not save. Please try again."); return; } S.observations.unshift(r.data[0]); render(); toast("Observation saved"); }); return; }
  if ((b=t.closest("[data-save]"))) { var k=b.dataset.save.split("|"), tr=b.closest("tr"), row2={cohort_id:S.cohort.id,kind:k[0],week:+k[1],updated_at:new Date().toISOString()};
    var bad=false; tr.querySelectorAll("input[data-f]").forEach(function(i){ var f=i.dataset.f, v=i.value.trim(); if (["scans","insole_tx","returns"].indexOf(f)>-1) { if (v==="") row2[f]=null; else { var n=Number(v); if (!(n>=0) || Math.floor(n)!==n) bad=true; row2[f]=n; } } else if (f==="insole_gp") { if (v==="") row2[f]=null; else { var g=Number(v); if (!(g>=0)) bad=true; row2[f]=Math.round(g*100)/100; } } else row2[f]=v.slice(0,f==="notes"?1500:500); });
    if (bad) { toast("Use whole numbers of zero or more for counts, and zero or more for profit."); return; }
    if (row2.scans!=null && row2.insole_tx!=null && row2.insole_tx>row2.scans) { toast("Insole transactions linked to scans cannot be more than scans."); return; }
    var save=function(){ var i=S.scorecards.findIndex(function(x){ return x.kind===row2.kind&&x.week===row2.week; }); if (i>-1) S.scorecards[i]=Object.assign(S.scorecards[i],row2); else S.scorecards.push(row2); render(); };
    if (DEMO) { save(); toast("Saved (demonstration only)"); return; }
    b.disabled=true; SB.from("perform_scorecards").upsert(row2,{onConflict:"cohort_id,kind,week"}).then(function(r){ b.disabled=false; if (r.error) { toast("Could not save. Please check the figures."); return; } save(); toast("Scorecard saved"); }); return; }
});
document.addEventListener("input",function(ev){ var tr=ev.target.closest&&ev.target.closest("tr[data-row]"); if (!tr) return; var s=tr.querySelector('[data-f="scans"]').value, x=tr.querySelector('[data-f="insole_tx"]').value; tr.querySelector(".cv").innerHTML=conv({scans:s===""?null:+s,insole_tx:x===""?null:+x}); });

function signInView(){
  app.innerHTML='<div class="card login"><h1>Perform workspace</h1><p>Sign in with your BrightPath Academy account.</p><label>Email<input id="em" type="email" autocomplete="email"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><button class="btn dark" id="go">Sign in</button><p class="msg" id="msg"></p><p class="muted">No account yet? <a href="/#dashboard">Create one in the Academy</a> using the email your store gave us. <br><a href="?demo=1">See a demonstration with sample data</a></p></div>';
  document.getElementById("go").onclick=function(){ var m=document.getElementById("msg"); m.textContent=""; SB.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value}).then(function(r){ if (r.error) { m.textContent="Email or password is incorrect."; return; } ME=r.data.user; start(); }); };
}
function start(){
  who.innerHTML=DEMO?'<span>Demonstration</span>':'<span>'+e(ME.email)+'</span> <button class="btn line sm" id="out">Sign out</button>';
  var o=document.getElementById("out"); if (o) o.onclick=function(){ SB.auth.signOut().then(function(){ location.reload(); }); };
  app.innerHTML='<p class="muted">Loading your workspace...</p>';
  load().catch(function(){ app.innerHTML='<div class="card"><h2>Something went wrong</h2><p>Please refresh the page. If it keeps happening, contact BrightPath.</p></div>'; });
}
if (DEMO) { start(); return; }
SB=supabase.createClient(SBURL,ANON);
SB.auth.getSession().then(function(r){ if (r.data.session) { ME=r.data.session.user; start(); } else signInView(); });
})();
