[build]
  publish = "."

[build.environment]
  # These are public values (they appear in the website by design), so the secrets scanner should not block on them.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,TEAM_ORG,TEAM_SEATS"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
