<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Academy Admin | BrightPath Academy</title><link rel="icon" type="image/png" href="assets/favicon-32.png">
<style>
:root{--ink:#162A28;--mut:#5B6576;--line:#E3DCCD;--bg:#F7F4ED;--grn:#0F4C43;--nvy:#102B45;--gld:#C99A3F}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(150deg,#0E3D3A,#102B45);color:#fff}header .in{max-width:1240px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;gap:12px}
header img{width:36px;height:36px;border-radius:9px}header b{font-size:17px}header small{display:block;color:#E3C27A;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
header .who{margin-left:auto;font-size:13px;color:#C9D7D3}header button{margin-left:10px}
main{max-width:1240px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.login{max-width:420px;margin:60px auto}.login h1{font-family:Georgia,serif;margin:0 0 6px}.login p{color:var(--mut);margin:0 0 16px}
label{display:grid;gap:4px;font-weight:600;font-size:13px;margin-bottom:12px}input,select{font:inherit;padding:10px 12px;border:1px solid #CFC7B6;border-radius:10px;background:#fff}
.btn{border:0;border-radius:999px;padding:10px 18px;font:700 14px inherit;cursor:pointer;background:var(--grn);color:#fff}.btn.line{background:transparent;border:1px solid currentColor;color:var(--grn)}.btn.sm{padding:6px 12px;font-size:12.5px}
header .btn.line{color:#fff}
.msg{min-height:1.2em;font-size:14px;color:#B4232A}.msg.ok{color:#1A6B52}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stats b{display:block;font-family:Georgia,serif;font-size:26px;color:var(--grn)}.stats span{font-size:12.5px;color:var(--mut);font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #EEE8DB;vertical-align:top;font-size:14px}th{background:#F1ECE1;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
td small{display:block;color:var(--mut);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:2px 4px 2px 0;padding:3px 6px 3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#DFF0EA;color:#1A6B52}
.chip.off{background:#F3E3E3;color:#9B2C2C;text-decoration:line-through}.chip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px;line-height:1}
.grant{display:flex;gap:6px;margin-top:6px}.grant select{padding:5px 8px;font-size:12.5px}
.badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#FBF4E3;color:#7A5A1A}
.wrap{overflow-x:auto}
.tabs{display:flex;gap:8px;margin:0 0 16px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:10px 14px;font:700 15px inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}.tabs button[aria-pressed="true"]{color:var(--grn);border-bottom-color:var(--gld)}.tabs b{margin-left:4px;color:var(--ink)}.tabs i{font-style:normal;margin-left:6px;background:#C9A55A;color:#1D1A10;border-radius:999px;padding:1px 7px;font-size:11.5px}
td .btn.sm{margin:3px 4px 3px 0;display:inline-block;text-decoration:none}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.roles button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:600 13px inherit;cursor:pointer;color:var(--ink)}.roles button b{color:var(--grn);margin-left:4px}.roles button[aria-pressed="true"]{background:var(--grn);color:#fff;border-color:var(--grn)}.roles button[aria-pressed="true"] b{color:#E3C27A}
.sec{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A7A36;margin:4px 0 8px}
.role{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9F3EF;color:#0F4C43}.role.none{background:#F3EFE6;color:#7A6A4A}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="in"><img src="assets/img/pv-academy_logo.webp" alt=""><div><small>Private</small><b>Academy Admin</b></div><span class="who" id="who"></span></div></header>
<main id="app"><div class="card login"><h1>Admin sign in</h1><p>Use your Academy admin account.</p>
<label>Email<input id="em" type="email" autocomplete="email"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label>
<button class="btn" id="go">Sign in</button><p class="msg" id="msg"></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB=supabase.createClient("https://nrjwhdryvwdrqqlhbuuf.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yandoZHJ5dndkcnFxbGhidXVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTkyMDQsImV4cCI6MjEwNzU3NTIwNH0.u9FVgXD9OcoBUkZvuVAJIcS43LMnQET6_4rPpFYlbGc");
var NAMES={foundations:"Foundations",floor:"Master the Floor",fit:"Fit Intelligence",pathway:"Specialist Pathway",cfs:"Certified Fit Specialist",manager:"Manager Academy",master:"Master Fit Specialist",member:"All-access membership",enterprise:"Enterprise seat",bpg:"BrightPath Global team"};
var DATA=null, Q="", FR="", FA="", TAB="learners", LEADS=[], LS="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function d(x){return x?new Date(x).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}):"Never";}
async function api(body){ var s=(await SB.auth.getSession()).data.session; if(!s) throw new Error("Signed out"); var r=await fetch("/.netlify/functions/admin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify(body)}); var j=await r.json(); if(!r.ok) throw new Error(j.error||"Error"); return j; }
async function load(){ var app=document.getElementById("app"); try { DATA=await api({action:"list"}); try { LEADS=(await api({action:"leads"})).leads||[]; } catch(x){ LEADS=[]; } document.getElementById("who").innerHTML=esc(DATA.me)+' <button class="btn line sm" id="out">Sign out</button>'; render(); } catch(e){ app.innerHTML='<div class="card login"><h1>No access</h1><p>'+esc(e.message)+'</p><button class="btn" id="out">Sign out</button></div>'; } }
function render(){ if (TAB==="leads") renderLeads(); else renderLearners(); var nn=LEADS.filter(function(l){return l.status==="new";}).length; document.getElementById("app").insertAdjacentHTML("afterbegin",'<div class="tabs"><button data-tab="learners" aria-pressed="'+(TAB==="learners")+'">Learners <b>'+DATA.users.length+'</b></button><button data-tab="leads" aria-pressed="'+(TAB==="leads")+'">Leads <b>'+LEADS.length+'</b>'+(nn?'<i>'+nn+' new</i>':'')+'</button></div>'); }
function renderLearners(){
  var u=DATA.users, q=Q.toLowerCase();
  var paidOf=function(x){ return x.access.some(function(a){ return a.status==="active" && a.source==="stripe"; }); };
  var activeOf=function(x){ return x.access.some(function(a){ return a.status==="active"; }); };
  var list=u.filter(function(x){ return (!q || (x.email+" "+x.name+" "+x.org+" "+x.role).toLowerCase().indexOf(q)>-1) && (!FR || (FR==="__none"? !x.role : x.role===FR)) && (!FA || (FA==="paying"?paidOf(x):FA==="access"?activeOf(x):!activeOf(x))); });
  var sales=u.reduce(function(n,x){ return n+x.access.filter(function(a){ return a.source==="stripe"; }).length; },0);
  var active=u.filter(function(x){ return x.progress.updated && (Date.now()-new Date(x.progress.updated))<30*864e5; }).length;
  var roles={}; u.forEach(function(x){ var r=x.role||"__none"; roles[r]=(roles[r]||0)+1; });
  var opts=Object.keys(NAMES).map(function(k){ return '<option value="'+k+'">'+NAMES[k]+'</option>'; }).join("");
  document.getElementById("app").innerHTML='<div class="stats"><div><b>'+u.length+'</b><span>Learners</span></div><div><b>'+u.filter(activeOf).length+'</b><span>With course access</span></div><div><b>'+u.filter(paidOf).length+'</b><span>Paying learners</span></div><div><b>'+sales+'</b><span>Purchases</span></div><div><b>'+active+'</b><span>Active last 30 days</span></div></div>'+
  '<p class="sec">Team by role</p><div class="roles"><button data-role="" aria-pressed="'+(!FR)+'">Everyone<b>'+u.length+'</b></button>'+Object.keys(roles).sort().map(function(r){ return '<button data-role="'+esc(r)+'" aria-pressed="'+(FR===r)+'">'+(r==="__none"?"Role not set":esc(r))+'<b>'+roles[r]+'</b></button>'; }).join("")+'</div>'+
  '<div class="tools"><input id="q" placeholder="Search name, email, organisation or role" value="'+esc(Q)+'"><select id="fa"><option value="">All learners</option><option value="access"'+(FA==="access"?" selected":"")+'>Has course access</option><option value="paying"'+(FA==="paying"?" selected":"")+'>Paying</option><option value="free"'+(FA==="free"?" selected":"")+'>Free preview only</option></select><button class="btn line" id="csv">Export CSV</button><button class="btn line" id="rf">Refresh</button></div>'+
  '<div class="wrap"><table><thead><tr><th>Learner</th><th>Role</th><th>Progress</th><th>Access</th></tr></thead><tbody>'+
  (list.length?list.map(function(x){ return '<tr><td><b>'+esc(x.name||"(no name)")+'</b><small>'+esc(x.email)+'</small><small>'+esc(x.org)+'</small>'+(x.confirmed?'':'<span class="badge">Email not confirmed</span>')+'<small>Joined '+d(x.created)+' &middot; last sign-in '+d(x.last)+'</small></td><td>'+(x.role?'<span class="role">'+esc(x.role)+'</span>':'<span class="role none">Not set</span>')+'</td><td><b>'+x.progress.topics+'</b> topics<small>'+(x.progress.track?esc(x.progress.track)+' pathway':'')+'</small><small>Last activity: '+d(x.progress.updated)+'</small></td><td>'+
    (x.access.map(function(a){ return '<span class="chip'+(a.status!=="active"?" off":"")+'" title="'+esc(a.source)+', '+d(a.created_at)+'">'+esc(NAMES[a.key]||a.key)+' <button data-'+(a.status==="active"?"revoke":"restore")+'="'+a.id+'" aria-label="'+(a.status==="active"?"Remove":"Restore")+' access">'+(a.status==="active"?"&times;":"&#8634;")+'</button></span>'; }).join("")||'<small>Free preview only</small>')+
    '<div class="grant"><select data-sel="'+x.id+'">'+opts+'</select><button class="btn sm" data-grant="'+x.id+'">Grant</button></div></td></tr>'; }).join(""):'<tr><td colspan="4">No learners match.</td></tr>')+'</tbody></table></div>';
}

var KIND={apply:"Applied",brochure:"Brochure",advisor:"Advisor call",enterprise:"Enterprise"};
function wa(p){ var d=String(p||"").replace(/[^\d]/g,""); return d?'https://wa.me/'+d:""; }
function renderLeads(){
  var q=Q.toLowerCase(), list=LEADS.filter(function(l){ return (!LS||l.status===LS) && (!q || [l.name,l.email,l.phone,l.organisation,l.role,l.interest,l.country].join(" ").toLowerCase().indexOf(q)>-1); });
  var c=function(st){ return LEADS.filter(function(l){ return l.status===st; }).length; };
  var week=LEADS.filter(function(l){ return Date.now()-new Date(l.created_at)<7*864e5; }).length;
  document.getElementById("app").innerHTML='<div class="stats"><div><b>'+LEADS.length+'</b><span>All leads</span></div><div><b>'+week+'</b><span>Last 7 days</span></div><div><b>'+c("new")+'</b><span>New, to contact</span></div><div><b>'+c("contacted")+'</b><span>Contacted</span></div><div><b>'+c("won")+'</b><span>Won</span></div></div>'+
  '<div class="roles">'+[["","All"],["new","New"],["contacted","Contacted"],["won","Won"],["lost","Lost"]].map(function(x){ return '<button data-ls="'+x[0]+'" aria-pressed="'+(LS===x[0])+'">'+x[1]+'<b>'+(x[0]?c(x[0]):LEADS.length)+'</b></button>'; }).join("")+'</div>'+
  '<div class="tools"><input id="q" placeholder="Search name, email, phone, organisation or programme" value="'+esc(Q)+'"><button class="btn line" id="lcsv">Export CSV</button><button class="btn line" id="rf">Refresh</button></div>'+
  '<div class="wrap"><table><thead><tr><th>Lead</th><th>Interest</th><th>Contact</th><th>Status</th></tr></thead><tbody>'+
  (list.length?list.map(function(l){ var w=wa(l.phone); return '<tr><td><b>'+esc(l.name)+'</b><small>'+esc(l.role||"")+(l.organisation?' &middot; '+esc(l.organisation):'')+'</small><small>'+esc(l.country||"")+'</small><small>'+new Date(l.created_at).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'</small></td><td><span class="role">'+esc(KIND[l.kind]||l.kind)+'</span><small><b>'+esc(l.interest||"")+'</b></small><small>Team: '+esc(l.team_size||"")+'</small>'+(l.message?'<small>&ldquo;'+esc(l.message)+'&rdquo;</small>':'')+'</td><td><small>Prefers '+esc(l.contact_pref||"")+'</small>'+(w?'<a class="btn sm" href="'+w+'" target="_blank" rel="noopener">WhatsApp</a> ':'')+(l.phone?'<a class="btn line sm" href="tel:'+esc(l.phone)+'">Call</a> ':'')+'<a class="btn line sm" href="mailto:'+esc(l.email)+'">Email</a><small>'+esc(l.phone||"")+'<br>'+esc(l.email)+'</small></td><td><select data-lead-st="'+l.id+'">'+["new","contacted","won","lost"].map(function(s){ return '<option value="'+s+'"'+(l.status===s?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'; }).join("")+'</select></td></tr>'; }).join(""):'<tr><td colspan="4">No leads yet. Apply, brochure and advisor requests from the website appear here.</td></tr>')+'</tbody></table></div>';
}
document.addEventListener("click", async function(e){
  var t=e.target;
  if (t.id==="go") { var m=document.getElementById("msg"); m.textContent=""; var r=await SB.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value}); if (r.error) { m.textContent="Email or password is incorrect."; return; } load(); }
  if (t.id==="out") { await SB.auth.signOut(); location.reload(); }
  if (t.id==="rf") load();
  var tb=t.closest&&t.closest("[data-tab]"); if (tb) { TAB=tb.dataset.tab; Q=""; render(); return; }
  var ls=t.closest&&t.closest("[data-ls]"); if (ls) { LS=ls.dataset.ls; render(); return; }
  if (t.id==="lcsv") { var rows=[["Date","Type","Name","Email","Phone","Country","Organisation","Role","Interest","Team size","Prefers","Message","Status"]].concat(LEADS.map(function(l){ return [new Date(l.created_at).toISOString().slice(0,16).replace("T"," "),KIND[l.kind]||l.kind,l.name,l.email,l.phone,l.country,l.organisation,l.role,l.interest,l.team_size,l.contact_pref,l.message,l.status]; })); var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n"); var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="brightpath-leads.csv"; a.click(); }
  if (t.dataset && t.dataset.role!==undefined && t.closest(".roles")) { FR=t.dataset.role; render(); }
  var rb=t.closest && t.closest(".roles button"); if (rb && rb!==t) { FR=rb.dataset.role; render(); }
  if (t.dataset.grant) { var k=document.querySelector('[data-sel="'+t.dataset.grant+'"]').value; if (!confirm("Grant "+NAMES[k]+" to this learner?")) return; t.disabled=true; try { await api({action:"grant",user_id:t.dataset.grant,key:k}); await load(); } catch(x){ alert(x.message); t.disabled=false; } }
  if (t.dataset.revoke) { if (!confirm("Remove this access? The learner will lose it immediately.")) return; await api({action:"revoke",id:t.dataset.revoke}); load(); }
  if (t.dataset.restore) { await api({action:"restore",id:t.dataset.restore}); load(); }
  if (t.id==="csv") { var rows=[["Name","Email","Organisation","Role","Confirmed","Joined","Last sign-in","Topics completed","Active access"]].concat(DATA.users.map(function(x){ return [x.name,x.email,x.org,x.role||"",x.confirmed?"Yes":"No",d(x.created),d(x.last),x.progress.topics,x.access.filter(function(a){return a.status==="active";}).map(function(a){return NAMES[a.key]||a.key;}).join("; ")]; }));
    var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n"); var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="brightpath-learners.csv"; a.click(); }
});
document.addEventListener("change", async function(e){ if (e.target.id==="fa") { FA=e.target.value; render(); } if (e.target.dataset && e.target.dataset.leadSt) { var id=e.target.dataset.leadSt, v=e.target.value; try { await api({action:"lead",id:id,status:v}); LEADS.forEach(function(l){ if (String(l.id)===id) l.status=v; }); render(); } catch(x){ alert(x.message); } } });
document.addEventListener("input", function(e){ if (e.target.id==="q") { Q=e.target.value; var pos=e.target.selectionStart; render(); var n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); } });
document.addEventListener("keydown", function(e){ if (e.key==="Enter" && document.getElementById("pw") && document.activeElement && document.activeElement.id==="pw") document.getElementById("go").click(); });
SB.auth.getSession().then(function(r){ if (r.data.session) load(); });
</script></body></html>
