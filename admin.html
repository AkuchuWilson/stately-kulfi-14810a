<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Academy Admin | BrightPath Academy</title><link rel="icon" type="image/png" href="assets/favicon-32.png">
<style>
:root{--ink:#162A28;--mut:#5B6576;--line:#E3DCCD;--bg:#F7F4ED;--grn:#0F4C43;--nvy:#102B45;--gld:#C99A3F}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(150deg,#0E3D3A,#102B45);color:#fff}header .in{max-width:1240px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;gap:12px}
header img{width:36px;height:36px;border-radius:9px}header b{font-size:17px}header small{display:block;color:#E3C27A;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
header .who{margin-left:auto;font-size:13px;color:#C9D7D3}header button{margin-left:10px}
main{max-width:1240px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.login{max-width:420px;margin:60px auto}.login h1{font-family:Georgia,serif;margin:0 0 6px}.login p{color:var(--mut);margin:0 0 16px}
label{display:grid;gap:4px;font-weight:600;font-size:13px;margin-bottom:12px}input,select{font:inherit;padding:10px 12px;border:1px solid #CFC7B6;border-radius:10px;background:#fff}
.btn{border:0;border-radius:999px;padding:10px 18px;font:700 14px inherit;cursor:pointer;background:var(--grn);color:#fff}.btn.line{background:transparent;border:1px solid currentColor;color:var(--grn)}.btn.sm{padding:6px 12px;font-size:12.5px}
header .btn.line{color:#fff}
.msg{min-height:1.2em;font-size:14px;color:#B4232A}.msg.ok{color:#1A6B52}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stats b{display:block;font-family:Georgia,serif;font-size:26px;color:var(--grn)}.stats span{font-size:12.5px;color:var(--mut);font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #EEE8DB;vertical-align:top;font-size:14px}th{background:#F1ECE1;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
td small{display:block;color:var(--mut);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:2px 4px 2px 0;padding:3px 6px 3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#DFF0EA;color:#1A6B52}
.chip.off{background:#F3E3E3;color:#9B2C2C;text-decoration:line-through}.chip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px;line-height:1}
.grant{display:flex;gap:6px;margin-top:6px}.grant select{padding:5px 8px;font-size:12.5px}
.badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#FBF4E3;color:#7A5A1A}
.wrap{overflow-x:auto}
.tabs{display:flex;gap:8px;margin:0 0 16px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:10px 14px;font:700 15px inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}.tabs button[aria-pressed="true"]{color:var(--grn);border-bottom-color:var(--gld)}.tabs b{margin-left:4px;color:var(--ink)}.tabs i{font-style:normal;margin-left:6px;background:#C9A55A;color:#1D1A10;border-radius:999px;padding:1px 7px;font-size:11.5px}
.pfl{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}.pfl select,.pfl input{padding:6px 8px;font-size:13px}
.exf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.exf label{display:grid;gap:4px;font-size:12.5px;font-weight:700}.exf textarea{min-height:70px;font:inherit;padding:8px;border:1px solid #CFC7B6;border-radius:10px}
td details small{display:block;margin-top:4px}
td .btn.sm{margin:3px 4px 3px 0;display:inline-block;text-decoration:none}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.roles button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:600 13px inherit;cursor:pointer;color:var(--ink)}.roles button b{color:var(--grn);margin-left:4px}.roles button[aria-pressed="true"]{background:var(--grn);color:#fff;border-color:var(--grn)}.roles button[aria-pressed="true"] b{color:#E3C27A}
.sec{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A7A36;margin:4px 0 8px}
.role{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#E9F3EF;color:#0F4C43}.role.none{background:#F3EFE6;color:#7A6A4A}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body>

function render(){ if (TAB==="leads") renderLeads(); else if (TAB==="feedback") renderFeedback(); else if (TAB==="perform") renderPerform(); else renderLearners(); var nn=LEADS.filter(function(l){return l.status==="new";}).length; document.getElementById("app").insertAdjacentHTML("afterbegin",'<div class="tabs"><button data-tab="learners" aria-pressed="'+(TAB==="learners")+'">Learners <b>'+DATA.users.length+'</b></button><button data-tab="leads" aria-pressed="'+(TAB==="leads")+'">Leads <b>'+LEADS.length+'</b>'+(nn?'<i>'+nn+' new</i>':'')+'</button><button data-tab="feedback" aria-pressed="'+(TAB==="feedback")+'">Feedback <b>'+FBK.length+'</b>'+(FBK.filter(function(f){return f.status==="pending"&&f.consent_publish;}).length?'<i>'+FBK.filter(function(f){return f.status==="pending"&&f.consent_publish;}).length+' to review</i>':'')+'</button><button data-tab="perform" aria-pressed="'+(TAB==="perform")+'">Perform <b>'+(PF?PF.apps.length:0)+'</b>'+(PF&&PF.apps.filter(function(a){return a.status==="new";}).length?'<i>'+PF.apps.filter(function(a){return a.status==="new";}).length+' new</i>':'')+'</button></div>'); }
function renderLearners(){
  var u=DATA.users, q=Q.toLowerCase();
  var paidOf=function(x){ return x.access.some(function(a){ return a.status==="active" && a.source==="stripe"; }); };

  var list=u.filter(function(x){ return (!q || (x.email+" "+x.name+" "+x.org+" "+x.role).toLowerCase().indexOf(q)>-1) && (!FR || (FR==="__none"? !x.role : x.role===FR)) && (!FA || (FA==="paying"?paidOf(x):FA==="access"?activeOf(x):!activeOf(x))); });
  var sales=u.reduce(function(n,x){ return n+x.access.filter(function(a){ return a.source==="stripe"; }).length; },0);
  var active=u.filter(function(x){ return x.progress.updated && (Date.now()-new Date(x.progress.updated))<30*864e5; }).length;
  var roles={}; u.forEach(function(x){ var r=x.role||"__none"; roles[r]=(roles[r]||0)+1; });
  var opts=Object.keys(NAMES).map(function(k){ return '<option value="'+k+'">'+NAMES[k]+'</option>'; }).join("");

  '<p class="sec">Team by role</p><div class="roles"><button data-role="" aria-pressed="'+(!FR)+'">Everyone<b>'+u.length+'</b></button>'+Object.keys(roles).sort().map(function(r){ return '<button data-role="'+esc(r)+'" aria-pressed="'+(FR===r)+'">'+(r==="__none"?"Role not set":esc(r))+'<b>'+roles[r]+'</b></button>'; }).join("")+'</div>'+
  '<div class="tools"><input id="q" placeholder="Search name, email, organisation or role" value="'+esc(Q)+'"><select id="fa"><option value="">All learners</option><option value="access"'+(FA==="access"?" selected":"")+'>Has course access</option><option value="paying"'+(FA==="paying"?" selected":"")+'>Paying</option><option value="free"'+(FA==="free"?" selected":"")+'>Free preview only</option></select><button class="btn line" id="csv">Export CSV</button><button class="btn line" id="rf">Refresh</button></div>'+
  '<div class="wrap"><table><thead><tr><th>Learner</th><th>Role</th><th>Progress</th><th>Access</th></tr></thead><tbody>'+
  (list.length?list.map(function(x){ return '<tr><td><b>'+esc(x.name||"(no name)")+'</b><small>'+esc(x.email)+'</small><small>'+esc(x.org)+'</small>'+(x.confirmed?'':'<span class="badge">Email not confirmed</span>')+'<small>Joined '+d(x.created)+' &middot; last sign-in '+d(x.last)+'</small></td><td>'+(x.role?'<span class="role">'+esc(x.role)+'</span>':'<span class="role none">Not set</span>')+'</td><td><b>'+x.progress.topics+'</b> topics<small>'+(x.progress.track?esc(x.progress.track)+' pathway':'')+'</small><small>Last activity: '+d(x.progress.updated)+'</small></td><td>'+

    '<div class="grant"><select data-sel="'+x.id+'">'+opts+'</select><button class="btn sm" data-grant="'+x.id+'">Grant</button></div></td></tr>'; }).join(""):'<tr><td colspan="4">No learners match.</td></tr>')+'</tbody></table></div>';
}

var KIND={apply:"Applied",brochure:"Brochure",advisor:"Advisor call",enterprise:"Enterprise"};
function wa(p){ var d=String(p||"").replace(/[^\d]/g,""); return d?'https://wa.me/'+d:""; }


var AI_PROMPT="You are drafting a short workplace coaching exercise for BrightPath Academy (footwear fitting and customer conversation training).\nUse only the approved BrightPath material provided below. Do not invent statistics, medical claims or product claims.\nAudience: retail sales staff in a footwear store that uses a foot scanner.\nAnonymised store challenge: [paste an anonymised challenge, with no store, staff or customer names and no health details]\nRelevant approved lesson notes: [paste lesson text]\n\nReturn these sections in plain English:\n1. Title (max 12 words)\n2. Situation (2 sentences)\n3. Skill to practise (1 to 2 sentences)\n4. Suggested questions (3 open questions)\n5. Example response (60 to 90 words, respectful, no pressure, no diagnosis)\n6. Short role-play (instructions for two people, under 3 minutes)\n7. Manager observation checklist (4 to 5 observable behaviours)\n8. Professional boundaries and referral guidance (when to refer to a podiatrist or doctor; never diagnose; never promise outcomes)\n\nRules: no pressure-selling language, no urgency, no guaranteed results, no medical promises, and do not mention any real person or store.";

function pfSel(name,id,cur,opts,lock){ return '<select data-pf="'+name+'" data-id="'+id+'"'+(lock?' disabled':'')+'>'+Object.keys(opts).filter(function(k){ return !lock&&name==="payment_status"?["paid","test_paid"].indexOf(k)<0||k===cur:true; }).map(function(k){ return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+opts[k]+'</option>'; }).join("")+'</select>'; }
function renderPerform(){
  var A=document.getElementById("app");

  var sub='<div class="roles">'+[["apps","Applications"],["cohorts","Pilots and people"],["ex","Exercise library"]].map(function(x){ return '<button data-psub="'+x[0]+'" aria-pressed="'+(PSUB===x[0])+'">'+x[1]+'</button>'; }).join("")+'</div>';
  var html='';
  if (PSUB==="apps") {
    html='<p class="sec">Founding pilot applications. Paid status is set only by a verified Stripe payment. '+(PERFORM_LINK?'Payment link: '+(PERFORM_LINK_MODE==="test"?'<b>TEST MODE</b>':'live'):'<b>Payment link not set up yet.</b>')+'</p><div class="wrap"><table><thead><tr><th>Applicant</th><th>Store</th><th>Challenge</th><th>Status</th></tr></thead><tbody>'+
    (PF.apps.length?PF.apps.map(function(a){ var lock=["paid","test_paid"].indexOf(a.payment_status)>-1; return '<tr><td><b>'+esc(a.contact_name)+'</b><small>'+esc(a.email)+'</small><small>Prefers '+esc(a.contact_pref||"")+'</small><small>'+d(a.created_at)+'</small></td><td><b>'+esc(a.organisation)+'</b><small>'+esc(a.country||"")+'</small><small>'+(a.stores||"?")+' store(s), '+(a.staff||"?")+' staff</small><small>Scanner: '+esc(a.uses_scanner||"")+'</small></td><td><small style="white-space:pre-wrap">'+esc(a.challenge||"")+'</small></td><td><label class="pfl">Application '+pfSel("status",a.id,a.status,PST)+'</label><label class="pfl">Payment '+pfSel("payment_status",a.id,a.payment_status,PAY,lock)+'</label><label class="pfl">Enrolment '+pfSel("enrolment_status",a.id,a.enrolment_status,ENR)+'</label>'+(a.paid_at?'<small>Paid '+d(a.paid_at)+'</small>':'')+
      (PERFORM_LINK&&!lock?'<button class="btn line sm" data-paylink="'+a.id+'" data-email="'+esc(a.email)+'">Copy payment link</button> ':'')+(a.cohort_id?'<small>Pilot #'+a.cohort_id+'</small>':'<button class="btn sm" data-mkcohort="'+a.id+'">Create pilot</button>')+'</td></tr>'; }).join(""):'<tr><td colspan="4">No applications yet. They appear here when someone applies at /perform.</td></tr>')+'</tbody></table></div>';
  } else if (PSUB==="cohorts") {
    html='<div class="card" style="margin-bottom:14px"><b>Create a pilot without an application</b> <small>(for example, a complimentary pilot)</small><div class="tools" style="margin-top:8px"><input id="ncName" placeholder="Store name"><input id="ncOrg" placeholder="Organisation"><button class="btn" id="ncGo">Create pilot</button></div></div>'+
    (PF.cohorts.length?PF.cohorts.map(function(c){ var mem=PF.members.filter(function(m){ return m.cohort_id===c.id; }), asg=PF.assignments.filter(function(a){ return a.cohort_id===c.id; });
      return '<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:17px">'+esc(c.store_name||c.name)+'</b><small>'+esc(c.organisation||"")+' &middot; Pilot #'+c.id+(c.application_id?' &middot; Application #'+c.application_id:' &middot; no application')+'</small></div><a class="btn line sm" href="/perform-workspace?c='+c.id+'" target="_blank">Open workspace</a></div>'+
      '<div class="tools" style="margin-top:10px"><label class="pfl">Start date <input type="date" data-cstart="'+c.id+'" value="'+(c.start_date||"")+'"></label><label class="pfl">Currency <input data-ccur="'+c.id+'" value="'+esc(c.currency)+'" maxlength="3" style="width:80px"></label><label class="pfl">Status <select data-cstat="'+c.id+'">'+["setup","active","completed"].map(function(x){ return '<option'+(x===c.status?' selected':'')+'>'+x+'</option>'; }).join("")+'</select></label><button class="btn line sm" data-csave="'+c.id+'">Save</button>'+(c.end_date?'<small>Ends '+d(c.end_date)+' &middot; learner access ends the next day</small>':'<small>Set a start date before adding people, so access can be time-limited.</small>')+'</div>'+

      '<div class="tools" style="margin-top:8px"><input data-mem="'+c.id+'" type="email" placeholder="Email of their Academy account"><select data-memrole="'+c.id+'"><option value="learner">Learner</option><option value="manager">Store manager</option></select><button class="btn sm" data-madd="'+c.id+'">Add person</button></div>'+

  } else {

    (PEDIT?exForm(PEDIT):'')+
    '<div class="wrap" style="margin-top:12px"><table><thead><tr><th>Exercise</th><th>Source</th><th>Status</th><th></th></tr></thead><tbody>'+ex.map(function(x){ return '<tr><td><b>'+esc(x.title)+'</b><small>'+esc(x.skill||"")+'</small><details><summary>Preview</summary><small><b>Situation.</b> '+esc(x.situation)+'</small><small><b>Example.</b> '+esc(x.example)+'</small><small><b>Checklist.</b> '+esc((x.checklist||[]).join("; "))+'</small><small><b>Boundaries.</b> '+esc(x.boundaries)+'</small></details></td><td><small>'+(x.source==="ai_draft"?"AI draft":"Written manually")+'</small></td><td><span class="role'+(x.status==="approved"?"":" none")+'">'+x.status+'</span>'+(x.approved_at?'<small>'+d(x.approved_at)+'</small>':'')+'</td><td>'+(x.status!=="approved"?'<button class="btn sm" data-exst="'+x.id+'|approved">Approve</button> ':'')+(x.status!=="retired"?'<button class="btn line sm" data-exst="'+x.id+'|retired">Retire</button> ':'')+'<button class="btn line sm" data-exedit="'+x.id+'">Edit</button></td></tr>'; }).join("")+'</tbody></table></div>';
  }
  A.innerHTML='<div class="stats"><div><b>'+PF.apps.length+'</b><span>Applications</span></div><div><b>'+PF.apps.filter(function(a){return a.payment_status==="paid";}).length+'</b><span>Paid (verified)</span></div><div><b>'+PF.cohorts.length+'</b><span>Pilots</span></div><div><b>'+PF.members.filter(function(m){return m.role==="learner";}).length+'</b><span>Learners enrolled</span></div><div><b>'+PF.exercises.filter(function(x){return x.status==="approved";}).length+'</b><span>Approved exercises</span></div></div>'+sub+html;

function exForm(x){
  var v=function(k){ return esc(x[k]||""); }, l=function(k){ return esc((x[k]||[]).join("\n")); };
  return '<div class="card" id="exForm" style="margin-top:12px"><b>'+(x.id?"Edit exercise":"New exercise")+'</b><div class="exf"><label>Title<input data-xf="title" value="'+v("title")+'"></label><label>Skill<input data-xf="skill" value="'+v("skill")+'"></label><label>Situation<textarea data-xf="situation">'+v("situation")+'</textarea></label><label>Skill to practise<textarea data-xf="practise">'+v("practise")+'</textarea></label><label>Suggested questions (one per line)<textarea data-xf="questions">'+l("questions")+'</textarea></label><label>Example response<textarea data-xf="example">'+v("example")+'</textarea></label><label>Role-play<textarea data-xf="roleplay">'+v("roleplay")+'</textarea></label><label>Manager checklist (one per line)<textarea data-xf="checklist">'+l("checklist")+'</textarea></label><label>Professional boundaries and referral<textarea data-xf="boundaries">'+v("boundaries")+'</textarea></label><label>Related lesson IDs (comma separated)<input data-xf="lessons" value="'+esc((x.lessons||[]).join(", "))+'"></label><label>Source<select data-xf="source"><option value="manual"'+(x.source!=="ai_draft"?" selected":"")+'>Written manually</option><option value="ai_draft"'+(x.source==="ai_draft"?" selected":"")+'>AI draft, reviewed by me</option></select></label></div><button class="btn" id="exSave" data-id="'+(x.id||"")+'">Save as draft</button> <button class="btn line" id="exCancel">Cancel</button></div>';
}
async function pfReload(){ PF=await api({action:"perform_overview"}); render(); }
function renderFeedback(){
  var list=FBK.filter(function(f){ return !FS || f.status===FS; }), c=function(st){ return FBK.filter(function(f){ return f.status===st; }).length; };
  var avg=FBK.length?(FBK.reduce(function(a,f){ return a+f.rating; },0)/FBK.length).toFixed(1):"0";
  document.getElementById("app").innerHTML='<div class="stats"><div><b>'+FBK.length+'</b><span>Responses</span></div><div><b>'+avg+'</b><span>Average rating</span></div><div><b>'+c("pending")+'</b><span>To review</span></div><div><b>'+c("approved")+'</b><span>Published on website</span></div><div><b>'+FBK.filter(function(f){return f.consent_publish;}).length+'</b><span>Allowed to publish</span></div></div>'+
  '<p class="sec">Share this link with trained staff: <a href="/feedback.html" target="_blank">academy.brightpathglobal.org/feedback.html</a></p>'+
  '<div class="roles">'+[["","All"],["pending","To review"],["approved","Published"],["hidden","Hidden"]].map(function(x){ return '<button data-fs="'+x[0]+'" aria-pressed="'+(FS===x[0])+'">'+x[1]+'<b>'+(x[0]?c(x[0]):FBK.length)+'</b></button>'; }).join("")+'</div>'+
  '<div class="wrap"><table><thead><tr><th>From</th><th>Feedback</th><th>Publish?</th><th>Status</th></tr></thead><tbody>'+
  (list.length?list.map(function(f){ return '<tr><td><b>'+esc(f.name)+'</b><small>'+esc(f.role||"")+(f.organisation?' &middot; '+esc(f.organisation):'')+'</small><small>'+esc(f.email||"")+'</small><small>'+d(f.created_at)+'</small></td><td><span style="color:#C9A55A">'+"&#9733;".repeat(f.rating)+'</span><small><b>'+esc(f.programme||"")+'</b></small><div style="margin-top:4px">'+esc(f.comment)+'</div></td><td>'+(f.consent_publish?'<span class="role">Yes, consented</span>':'<span class="role none">No, private</span>')+'</td><td>'+(f.consent_publish?'<select data-fb-st="'+f.id+'">'+[["pending","To review"],["approved","Publish"],["hidden","Hide"]].map(function(o){ return '<option value="'+o[0]+'"'+(f.status===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join("")+'</select>':'<small>Private feedback</small>')+'</td></tr>'; }).join(""):'<tr><td colspan="4">No feedback yet. Share the feedback link with people you have trained.</td></tr>')+'</tbody></table></div>';
}
function renderLeads(){
  var q=Q.toLowerCase(), list=LEADS.filter(function(l){ return (!LS||l.status===LS) && (!q || [l.name,l.email,l.phone,l.organisation,l.role,l.interest,l.country].join(" ").toLowerCase().indexOf(q)>-1); });
  var c=function(st){ return LEADS.filter(function(l){ return l.status===st; }).length; };
  var week=LEADS.filter(function(l){ return Date.now()-new Date(l.created_at)<7*864e5; }).length;
  document.getElementById("app").innerHTML='<div class="stats"><div><b>'+LEADS.length+'</b><span>All leads</span></div><div><b>'+week+'</b><span>Last 7 days</span></div><div><b>'+c("new")+'</b><span>New, to contact</span></div><div><b>'+c("contacted")+'</b><span>Contacted</span></div><div><b>'+c("won")+'</b><span>Won</span></div></div>'+
  '<div class="roles">'+[["","All"],["new","New"],["contacted","Contacted"],["won","Won"],["lost","Lost"]].map(function(x){ return '<button data-ls="'+x[0]+'" aria-pressed="'+(LS===x[0])+'">'+x[1]+'<b>'+(x[0]?c(x[0]):LEADS.length)+'</b></button>'; }).join("")+'</div>'+
  '<div class="tools"><input id="q" placeholder="Search name, email, phone, organisation or programme" value="'+esc(Q)+'"><button class="btn line" id="lcsv">Export CSV</button><button class="btn line" id="rf">Refresh</button></div>'+
  '<div class="wrap"><table><thead><tr><th>Lead</th><th>Interest</th><th>Contact</th><th>Status</th></tr></thead><tbody>'+
  (list.length?list.map(function(l){ var w=wa(l.phone); return '<tr><td><b>'+esc(l.name)+'</b><small>'+esc(l.role||"")+(l.organisation?' &middot; '+esc(l.organisation):'')+'</small><small>'+esc(l.country||"")+'</small><small>'+new Date(l.created_at).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'</small></td><td><span class="role">'+esc(KIND[l.kind]||l.kind)+'</span><small><b>'+esc(l.interest||"")+'</b></small><small>Team: '+esc(l.team_size||"")+'</small>'+(l.message?'<small>&ldquo;'+esc(l.message)+'&rdquo;</small>':'')+'</td><td><small>Prefers '+esc(l.contact_pref||"")+'</small>'+(w?'<a class="btn sm" href="'+w+'" target="_blank" rel="noopener">WhatsApp</a> ':'')+(l.phone?'<a class="btn line sm" href="tel:'+esc(l.phone)+'">Call</a> ':'')+'<a class="btn line sm" href="mailto:'+esc(l.email)+'">Email</a><small>'+esc(l.phone||"")+'<br>'+esc(l.email)+'</small></td><td><select data-lead-st="'+l.id+'">'+["new","contacted","won","lost"].map(function(s){ return '<option value="'+s+'"'+(l.status===s?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'; }).join("")+'</select></td></tr>'; }).join(""):'<tr><td colspan="4">No leads yet. Apply, brochure and advisor requests from the website appear here.</td></tr>')+'</tbody></table></div>';
}
document.addEventListener("click", async function(e){
  var t=e.target;
  if (t.id==="go") { var m=document.getElementById("msg"); m.textContent=""; var r=await SB.auth.signInWithPassword({email:document.getElementById("em").value.trim(),password:document.getElementById("pw").value}); if (r.error) { m.textContent="Email or password is incorrect."; return; } load(); }
  if (t.id==="out") { await SB.auth.signOut(); location.reload(); }
  if (t.id==="rf") load();
  var tb=t.closest&&t.closest("[data-tab]"); if (tb) { TAB=tb.dataset.tab; Q=""; render(); return; }
  var ls=t.closest&&t.closest("[data-ls]"); if (ls) { LS=ls.dataset.ls; render(); return; }
  var ps=t.closest&&t.closest("[data-psub]"); if (ps) { PSUB=ps.dataset.psub; render(); return; }
  if (t.dataset && t.dataset.mkcohort) { var ap=PF.apps.find(function(a){ return String(a.id)===t.dataset.mkcohort; }); try { await api({action:"perform_cohort_create",application_id:ap.id,name:"Scan-to-Fit pilot",organisation:ap.organisation,store_name:ap.organisation,currency:"USD"}); PSUB="cohorts"; await pfReload(); } catch(x){ alert(x.message); } return; }
  if (t.id==="ncGo") { try { await api({action:"perform_cohort_create",name:"Scan-to-Fit pilot",store_name:document.getElementById("ncName").value,organisation:document.getElementById("ncOrg").value,currency:"USD"}); await pfReload(); } catch(x){ alert(x.message); } return; }
  if (t.dataset && t.dataset.csave) { var cid=t.dataset.csave; try { await api({action:"perform_cohort_update",id:cid,start_date:document.querySelector('[data-cstart="'+cid+'"]').value,currency:document.querySelector('[data-ccur="'+cid+'"]').value.toUpperCase(),status:document.querySelector('[data-cstat="'+cid+'"]').value}); await pfReload(); } catch(x){ alert(x.message); } return; }
  if (t.dataset && t.dataset.madd) { var c2=t.dataset.madd; var r=await api({action:"perform_member_add",cohort_id:c2,email:document.querySelector('[data-mem="'+c2+'"]').value,role:document.querySelector('[data-memrole="'+c2+'"]').value}); if (!r.ok) { alert(r.error); return; } await pfReload(); return; }
  if (t.dataset && t.dataset.mrm) { if (!confirm("Remove this person from the pilot? Their pilot access ends now.")) return; var k=t.dataset.mrm.split("|"); await api({action:"perform_member_remove",cohort_id:k[0],user_id:k[1]}); await pfReload(); return; }
  if (t.dataset && t.dataset.plan) { var r2=await api({action:"perform_assign_plan",cohort_id:t.dataset.plan}); if (!r2.ok) { alert(r2.error); return; } await pfReload(); return; }
  if (t.dataset && t.dataset.exst) { var q=t.dataset.exst.split("|"); if (q[1]==="approved" && !confirm("Approve this exercise? You confirm you have reviewed it for accuracy, tone and professional boundaries.")) return; await api({action:"perform_exercise_status",id:q[0],status:q[1]}); await pfReload(); return; }
  if (t.dataset && t.dataset.exnew) { PEDIT={source:"manual"}; render(); return; }
  if (t.dataset && t.dataset.exedit) { PEDIT=PF.exercises.find(function(x){ return String(x.id)===t.dataset.exedit; }); render(); return; }
  if (t.id==="exCancel") { PEDIT=null; render(); return; }
  if (t.id==="exSave") { var o={action:"perform_exercise_save",id:t.dataset.id||undefined}; document.querySelectorAll("[data-xf]").forEach(function(f){ var k=f.dataset.xf, v=f.value; o[k]=(k==="questions"||k==="checklist")?v.split("\n").map(function(s){return s.trim();}).filter(Boolean):k==="lessons"?v.split(",").map(function(s){return s.trim();}).filter(Boolean):v; }); try { await api(o); PEDIT=null; await pfReload(); } catch(x){ alert(x.message); } return; }
  if (t.id==="aiCopy") { try { await navigator.clipboard.writeText(AI_PROMPT); alert("Prompt copied. Paste the AI draft into New exercise, review it, then approve."); } catch(x){ prompt("Copy this prompt:",AI_PROMPT); } return; }
  if (t.dataset && t.dataset.paylink) { var link=PERFORM_LINK+"?client_reference_id=perf-"+t.dataset.paylink+"&prefilled_email="+encodeURIComponent(t.dataset.email); try { await navigator.clipboard.writeText(link); } catch(x){ prompt("Copy this payment link:",link); } if (confirm("Link copied. Mark this application as 'Payment link sent'?")) { await api({action:"perform_app_update",id:t.dataset.paylink,payment_status:"link_sent"}); await pfReload(); } return; }
  var fsb=t.closest&&t.closest("[data-fs]"); if (fsb) { FS=fsb.dataset.fs; render(); return; }
  if (t.id==="lcsv") { var rows=[["Date","Type","Name","Email","Phone","Country","Organisation","Role","Interest","Team size","Prefers","Message","Status"]].concat(LEADS.map(function(l){ return [new Date(l.created_at).toISOString().slice(0,16).replace("T"," "),KIND[l.kind]||l.kind,l.name,l.email,l.phone,l.country,l.organisation,l.role,l.interest,l.team_size,l.contact_pref,l.message,l.status]; })); var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n"); var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="brightpath-leads.csv"; a.click(); }
  if (t.dataset && t.dataset.role!==undefined && t.closest(".roles")) { FR=t.dataset.role; render(); }
  var rb=t.closest && t.closest(".roles button"); if (rb && rb!==t) { FR=rb.dataset.role; render(); }
  if (t.dataset.grant) { var k=document.querySelector('[data-sel="'+t.dataset.grant+'"]').value; if (!confirm("Grant "+NAMES[k]+" to this learner?")) return; t.disabled=true; try { await api({action:"grant",user_id:t.dataset.grant,key:k}); await load(); } catch(x){ alert(x.message); t.disabled=false; } }
  if (t.dataset.revoke) { if (!confirm("Remove this access? The learner will lose it immediately.")) return; await api({action:"revoke",id:t.dataset.revoke}); load(); }
  if (t.dataset.restore) { await api({action:"restore",id:t.dataset.restore}); load(); }
  if (t.id==="csv") { var rows=[["Name","Email","Organisation","Role","Confirmed","Joined","Last sign-in","Topics completed","Active access"]].concat(DATA.users.map(function(x){ return [x.name,x.email,x.org,x.role||"",x.confirmed?"Yes":"No",d(x.created),d(x.last),x.progress.topics,x.access.filter(function(a){return a.status==="active";}).map(function(a){return NAMES[a.key]||a.key;}).join("; ")]; }));
    var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n"); var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="brightpath-learners.csv"; a.click(); }
});
document.addEventListener("change", async function(e){ if (e.target.id==="fa") { FA=e.target.value; render(); } if (e.target.dataset && e.target.dataset.pf) { var o2={action:"perform_app_update",id:e.target.dataset.id}; o2[e.target.dataset.pf]=e.target.value; try { await api(o2); await pfReload(); } catch(x){ alert(x.message); await pfReload(); } return; } if (e.target.dataset && e.target.dataset.fbSt) { var fid=e.target.dataset.fbSt, fv=e.target.value; try { await api({action:"fb",id:fid,status:fv}); FBK.forEach(function(f){ if (String(f.id)===fid) f.status=fv; }); render(); } catch(x){ alert(x.message); } }
  if (e.target.dataset && e.target.dataset.leadSt) { var id=e.target.dataset.leadSt, v=e.target.value; try { await api({action:"lead",id:id,status:v}); LEADS.forEach(function(l){ if (String(l.id)===id) l.status=v; }); render(); } catch(x){ alert(x.message); } } });
